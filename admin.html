<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모아워크 상담 관리자 대시보드 (MOAWORK Admin)</title>
  
  <!-- 구글 웹 폰트 & 프리텐다드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --primary: #81442a;
      --primary-hover: #6a3520;
      --primary-light: #fbf5f2;
      --accent: #c48b71;
      --bg: #f8f6f2;
      --surface: #ffffff;
      --surface-border: #ede7df;
      --text-main: #2b2623;
      --text-muted: #756d67;
      --text-subtle: #9c938c;
      --success: #2e7d32;
      --success-bg: #edf7ed;
      --radius: 12px;
      --shadow-sm: 0 2px 8px rgba(43, 38, 35, 0.04);
      --shadow-md: 0 8px 24px rgba(43, 38, 35, 0.07);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Manrope", -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* ----------------------------------------------------
       헤더 영역
       ---------------------------------------------------- */
    .admin-header {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-mark {
      width: 40px;
      height: 40px;
      background-color: var(--primary);
      color: #fff;
      font-family: "EB Garamond", serif;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ----------------------------------------------------
       공통 버튼 스타일
       ---------------------------------------------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: var(--surface);
      border-color: var(--surface-border);
      color: var(--text-main);
    }
    .btn-outline:hover {
      background-color: var(--primary-light);
      border-color: var(--accent);
      color: var(--primary);
    }

    .btn-icon {
      padding: 10px;
    }

    /* ----------------------------------------------------
       메인 컨테이너
       ---------------------------------------------------- */
    .admin-container {
      max-width: 1280px;
      margin: 32px auto 0;
      padding: 0 24px;
    }

    /* 통계 요약 카드 그리드 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--surface-border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .stat-info {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      font-family: "Manrope", sans-serif;
    }

    /* 컨트롤 바 (검색, 정렬, 엑셀 다운로드) */
    .control-bar {
      background: var(--surface);
      padding: 16px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--surface-border);
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 8px 14px;
      flex: 1;
      max-width: 400px;
    }

    .search-input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      width: 100%;
      color: var(--text-main);
      margin-left: 8px;
    }

    .control-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ----------------------------------------------------
       상담 내역 테이블 & 카드 뷰
       ---------------------------------------------------- */
    .table-container {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--surface-border);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .inquiry-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .inquiry-table th {
      background: #faf8f5;
      padding: 16px 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--surface-border);
      white-space: nowrap;
    }

    .inquiry-table td {
      padding: 18px 20px;
      border-bottom: 1px solid var(--surface-border);
      font-size: 14px;
      vertical-align: middle;
    }

    .inquiry-table tbody tr:hover {
      background-color: var(--primary-light);
    }

    .user-name-tag {
      font-weight: 600;
      color: var(--primary);
    }

    .user-contact-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: "Manrope", sans-serif;
      font-weight: 500;
      background: #f3efe9;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    .inquiry-message {
      max-width: 480px;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-main);
      line-height: 1.5;
    }

    .date-tag {
      font-size: 13px;
      color: var(--text-subtle);
      font-family: "Manrope", sans-serif;
      white-space: nowrap;
    }

    /* 빈 데이터 상태 안내 */
    .empty-state {
      padding: 80px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* ----------------------------------------------------
       비밀번호 잠금 인증 모달
       ---------------------------------------------------- */
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(43, 38, 35, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .auth-card {
      background: var(--surface);
      width: 90%;
      max-width: 420px;
      padding: 36px 32px;
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .auth-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .auth-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .auth-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
      transition: var(--transition);
      text-align: center;
      letter-spacing: 2px;
    }

    .auth-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(129, 68, 42, 0.15);
    }

    .auth-error {
      color: #d32f2f;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    /* 로딩 스피너 애니메이션 */
    .spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* 반응형 모바일 뷰 */
    @media (max-width: 768px) {
      .header-inner {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }
      .control-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-wrap {
        max-width: 100%;
      }
      .inquiry-table, .inquiry-table tbody, .inquiry-table tr, .inquiry-table td {
        display: block;
        width: 100%;
      }
      .inquiry-table thead {
        display: none;
      }
      .inquiry-table td {
        padding: 12px 16px;
        border-bottom: none;
      }
      .inquiry-table tbody tr {
        border-bottom: 1px solid var(--surface-border);
        padding: 12px 0;
      }
    }
  </style>
</head>
<body>

  <!-- ====================================================
       관리자 인증 잠금 모달 (개인정보 보호)
       ==================================================== -->
  <div class="auth-overlay" id="auth-modal">
    <div class="auth-card">
      <div class="auth-icon">🔒</div>
      <h2 class="auth-title">관리자 본인 인증</h2>
      <p class="auth-desc">고객 상담 내역 및 연락처 열람을 위해<br>관리자 비밀번호를 입력해 주세요.</p>
      
      <form id="auth-form">
        <input 
          type="password" 
          id="auth-password" 
          class="auth-input" 
          placeholder="관리자 암호 입력" 
          autocomplete="current-password"
          required 
          autofocus
        >
        <p class="auth-error" id="auth-error-msg">비밀번호가 올바르지 않습니다.</p>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
          대시보드 접속하기
        </button>
      </form>
    </div>
  </div>

  <!-- ====================================================
       헤더
       ==================================================== -->
  <header class="admin-header">
    <div class="header-inner">
      <div class="brand-wrap">
        <div class="brand-logo-mark">M</div>
        <div>
          <h1 class="brand-title">모아워크 상담 관리 센터 <span class="brand-badge">ADMIN</span></h1>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline" id="refresh-btn">
          <svg id="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span>실시간 새로고침</span>
        </button>
        <button class="btn btn-primary" id="download-csv-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>엑셀(CSV) 저장</span>
        </button>
        <button class="btn btn-outline" id="logout-btn" title="잠금">
          <span>잠금</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ====================================================
       메인 대시보드
       ==================================================== -->
  <main class="admin-container">

    <!-- 통계 요약 카드 -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📨</div>
        <div class="stat-info">
          <span class="stat-label">총 접수 문의</span>
          <span class="stat-value" id="total-count">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-info">
          <span class="stat-label">오늘 신규 접수</span>
          <span class="stat-value" id="today-count">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏱️</div>
        <div class="stat-info">
          <span class="stat-label">최근 접수 일시</span>
          <span class="stat-value" id="latest-date" style="font-size: 16px; margin-top: 6px;">-</span>
        </div>
      </div>
    </section>

    <!-- 검색 및 필터 컨트롤 바 -->
    <section class="control-bar">
      <div class="search-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="고객 이름, 연락처, 문의 내용 실시간 검색..."
        >
      </div>
      <div class="control-actions">
        <span id="filtered-count" style="font-size: 14px; color: var(--text-muted);">조회 결과: 0건</span>
      </div>
    </section>

    <!-- 상담 문의 목록 테이블 -->
    <section class="table-container">
      <table class="inquiry-table">
        <thead>
          <tr>
            <th style="width: 140px;">접수 일시</th>
            <th style="width: 160px;">이름 / 상호명</th>
            <th style="width: 200px;">연락 방법</th>
            <th>문의 내용</th>
            <th style="width: 90px; text-align: center;">복사</th>
          </tr>
        </thead>
        <tbody id="inquiry-list">
          <tr>
            <td colspan="5" class="empty-state">
              <div class="empty-icon">⏳</div>
              <p>구글 스프레드시트에서 상담 데이터를 불러오는 중입니다...</p>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>

  <script>
    /**
     * ==========================================================================
     * 모아워크 상담 관리자 대시보드 로직
     * ==========================================================================
     */

    // 1. 구글 앱스 스크립트 웹 앱 URL (대표님이 script.js에 설정하신 주소)
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkDeTv0WuTYUu45oA435tKccSOHv24PscSgkmZHLjMJxCpUKHozXzwB4Y2v4dF6521/exec';

    // 2. 관리자 비밀번호 (원하시는 비밀번호로 자유롭게 변경 가능)
    const ADMIN_PASSWORD = 'moawork2026!';

    // 전역 상태 변수
    let inquiryData = [];
    let isAuthorized = false;

    // DOM 요소
    const authModal = document.getElementById('auth-modal');
    const authForm = document.getElementById('auth-form');
    const authPasswordInput = document.getElementById('auth-password');
    const authErrorMsg = document.getElementById('auth-error-msg');
    
    const refreshBtn = document.getElementById('refresh-btn');
    const refreshIcon = document.getElementById('refresh-icon');
    const downloadCsvBtn = document.getElementById('download-csv-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const searchInput = document.getElementById('search-input');

    const totalCountEl = document.getElementById('total-count');
    const todayCountEl = document.getElementById('today-count');
    const latestDateEl = document.getElementById('latest-date');
    const filteredCountEl = document.getElementById('filtered-count');
    const inquiryListEl = document.getElementById('inquiry-list');

    // 세션 인증 체크
    if (sessionStorage.getItem('moawork_admin_auth') === 'true') {
      isAuthorized = true;
      authModal.style.display = 'none';
      fetchInquiries();
    }

    // 비밀번호 제출 이벤트
    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredPassword = authPasswordInput.value.trim();

      if (enteredPassword === ADMIN_PASSWORD) {
        isAuthorized = true;
        sessionStorage.setItem('moawork_admin_auth', 'true');
        authModal.style.display = 'none';
        authErrorMsg.style.display = 'none';
        fetchInquiries();
      } else {
        authErrorMsg.style.display = 'block';
        authPasswordInput.value = '';
        authPasswordInput.focus();
      }
    });

    // 잠금(로그아웃) 버튼
    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('moawork_admin_auth');
      location.reload();
    });

    // 구글 스프레드시트 데이터 불러오기 (fetch GET)
    async function fetchInquiries() {
      if (!isAuthorized) return;

      refreshIcon.classList.add('spin');
      refreshBtn.disabled = true;

      try {
        // doGet(e)에 관리자 인증 파라미터 전달
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?auth=${encodeURIComponent(ADMIN_PASSWORD)}`);
        const result = await response.json();

        if (result && result.result === 'success') {
          inquiryData = result.data || [];
          updateDashboard(inquiryData);
        } else {
          showEmptyState('구글 앱스 스크립트에 doGet 함수 설정이 필요합니다. (안내 문서를 확인해 주세요)');
        }
      } catch (err) {
        console.error('데이터 조회 오류:', err);
        showEmptyState('데이터를 불러오지 못했습니다. 구글 앱스 스크립트 배포 상태를 확인해 주세요.');
      } finally {
        refreshIcon.classList.remove('spin');
        refreshBtn.disabled = false;
      }
    }

    // 화면 갱신
    function updateDashboard(list) {
      // 1. 통계 갱신
      totalCountEl.textContent = list.length;

      const todayStr = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
      const todayCount = list.filter(item => (item.date || '').includes(todayStr)).length;
      todayCountEl.textContent = todayCount;

      if (list.length > 0) {
        latestDateEl.textContent = list[list.length - 1].date || '-';
      } else {
        latestDateEl.textContent = '-';
      }

      renderTable(list);
    }

    // 테이블 렌더링
    function renderTable(list) {
      filteredCountEl.textContent = `조회 결과: ${list.length}건`;

      if (list.length === 0) {
        showEmptyState('접수된 상담 문의가 없습니다.');
        return;
      }

      // 최신순 정렬 (역순)
      const reversed = [...list].reverse();

      inquiryListEl.innerHTML = reversed.map((item, index) => `
        <tr>
          <td><span class="date-tag">${escapeHtml(item.date || '')}</span></td>
          <td><span class="user-name-tag">${escapeHtml(item.name || '')}</span></td>
          <td>
            <span class="user-contact-tag">
              📞 ${escapeHtml(item.contact || '')}
            </span>
          </td>
          <td><div class="inquiry-message">${escapeHtml(item.message || '')}</div></td>
          <td style="text-align: center;">
            <button 
              class="btn btn-outline btn-icon" 
              title="연락처 및 내용 복사"
              onclick="copyToClipboard('${escapeAttr(item.name)}', '${escapeAttr(item.contact)}', '${escapeAttr(item.message)}')"
            >
              📋
            </button>
          </td>
        </tr>
      `).join('');
    }

    // 안내 메시지 표시
    function showEmptyState(msg) {
      inquiryListEl.innerHTML = `
        <tr>
          <td colspan="5" class="empty-state">
            <div class="empty-icon">📂</div>
            <p>${msg}</p>
          </td>
        </tr>
      `;
    }

    // 실시간 검색
    searchInput.addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase().trim();
      if (!keyword) {
        renderTable(inquiryData);
        return;
      }

      const filtered = inquiryData.filter(item => {
        return (item.name || '').toLowerCase().includes(keyword) ||
               (item.contact || '').toLowerCase().includes(keyword) ||
               (item.message || '').toLowerCase().includes(keyword) ||
               (item.date || '').toLowerCase().includes(keyword);
      });

      renderTable(filtered);
    });

    // 새로고침 버튼
    refreshBtn.addEventListener('click', fetchInquiries);

    // CSV 다운로드 (엑셀 호환)
    downloadCsvBtn.addEventListener('click', () => {
      if (inquiryData.length === 0) {
        alert('다운로드할 데이터가 없습니다.');
        return;
      }

      let csvContent = '\uFEFF'; // 한글 엑셀 깨짐 방지용 BOM
      csvContent += '접수일시,이름/상호명,연락방법,문의내용\n';

      inquiryData.forEach(row => {
        const date = `"${(row.date || '').replace(/"/g, '""')}"`;
        const name = `"${(row.name || '').replace(/"/g, '""')}"`;
        const contact = `"${(row.contact || '').replace(/"/g, '""')}"`;
        const message = `"${(row.message || '').replace(/"/g, '""')}"`;
        csvContent += `${date},${name},${contact},${message}\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `모아워크_상담문의_목록_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // 클립보드 복사 함수
    window.copyToClipboard = function(name, contact, message) {
      const text = `[모아워크 상담 문의]\n• 신청자: ${name}\n• 연락처: ${contact}\n• 문의내용:\n${message}`;
      navigator.clipboard.writeText(text).then(() => {
        alert(`"${name}" 님의 상담 내용이 클립보드에 복사되었습니다!`);
      }).catch(err => {
        console.error('복사 실패:', err);
      });
    };

    // XSS 방지용 이스케이프 유틸
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    function escapeAttr(text) {
      return String(text || '').replace(/'/g, "\\'").replace(/\n/g, " ");
    }
  </script>
</body>
</html>
